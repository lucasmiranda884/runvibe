services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: runvibe
      POSTGRES_USER: runvibe
      POSTGRES_PASSWORD: runvibe
    ports:
      - "5432:5432"
    volumes:
      - runvibe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runvibe -d runvibe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  runvibe_postgres_data:
